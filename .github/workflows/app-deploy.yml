name: P1 Verified App Deploy

on:
  workflow_dispatch:
    inputs:
      record_name:
        description: Reviewed JSON filename in runner FDS_CICD_DeployInputs
        required: true
        type: string
      record_sha256:
        description: Independently reviewed SHA256 of the exact input record
        required: true
        type: string
      execute:
        description: Execute only in an approved nonoverlapping window with SSH broker ready
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  issues: read

concurrency:
  group: p1-app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == '321Team/infra-cicd' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.run_attempt == 1
    runs-on: [self-hosted, Linux, X64, p1-cicd, onprem, podman]
    timeout-minutes: 30
    env:
      CICD_CHECKOUT: cicd-deploy-${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOY_RECORD_NAME: ${{ inputs.record_name }}
      DEPLOY_RECORD_SHA256: ${{ inputs.record_sha256 }}
      DEPLOY_EXECUTE: ${{ inputs.execute && 'true' || 'false' }}
    steps:
      - name: Require normal Runner and unused checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname -s)" = cicd-runner01
          test "$(id -un)" = server01_cicd-runner
          test "$(id -u)" = 1000
          test ! -e "$GITHUB_WORKSPACE/$CICD_CHECKOUT"
          test ! -L "$GITHUB_WORKSPACE/$CICD_CHECKOUT"
      - name: Checkout the reviewed workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          path: ${{ env.CICD_CHECKOUT }}
          persist-credentials: false
          clean: false
          set-safe-directory: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Validate inputs without issuing or receiving a token
        if: ${{ !inputs.execute }}
        working-directory: ${{ env.CICD_CHECKOUT }}
        shell: bash
        run: exec /usr/bin/python3 -I -B -c 'import sys; sys.path.insert(0, "tools/delivery"); import deploy_workflow; raise SystemExit(deploy_workflow.main())'
      - name: Receive authenticated credential and execute approved Deploy
        if: ${{ inputs.execute }}
        working-directory: ${{ env.CICD_CHECKOUT }}
        env:
          DEPLOY_GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: exec /usr/bin/python3 -I -B -c 'import sys; sys.path.insert(0, "tools/delivery"); import deploy_workflow; raise SystemExit(deploy_workflow.main())'

name: P1 Source validation

on:
  # Stack bases ci/offline-supply-consumption-20260917 and ci/private-app-source-20260918
  # were removed on 2026-09-28: no open PR targets them. Docs-only changes skip the
  # hosted run because these checks do not read Markdown or docs/.
  # PR113/114 are explicit stack bases for offline source tests only.
  pull_request:
    branches: [main, codex/p2-observed-site-20261022, codex/p2-job-source-roles-20261023]
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-source-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == '321Team/infra-cicd'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the event commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; verified in actions/checkout
        with:
          persist-credentials: false
      - name: Test collectors and enforce smoke template equality
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -m unittest discover -s tools/parallel-prep -p 'test_*.py' -v
          python3 -m unittest discover -s tools/pki -p 'test_*.py' -v
          python3 -m unittest discover -s tools/trivy -p 'test_*.py' -v
          python3 -m unittest discover -s tools/delivery -p 'test_*.py' -v
          cmp -- templates/runner-smoke.yml .github/workflows/runner-smoke.yml
          printf 'SOURCE_VALIDATION=PASS\nDELIVERY_GATE=NOT_VERIFIED\n'

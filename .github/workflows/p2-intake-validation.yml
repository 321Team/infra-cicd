name: P2 intake offline validation

on:
  pull_request:
    # PR100 dependency: allow this exact stack base for offline tests only.
    branches: [main, codex/p2-nine-object-contract-20261020]
    paths: ['tools/phase2/**', 'templates/phase2/**', '.github/workflows/p2-intake-validation.yml']
  push:
    branches: [main]
    paths: ['tools/phase2/**', 'templates/phase2/**', '.github/workflows/p2-intake-validation.yml']

permissions:
  contents: read

jobs:
  p2-intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test P2 intake diagnostics with synthetic data only
        run: python3 -m unittest discover -s tools/phase2 -p 'test_*.py' -v

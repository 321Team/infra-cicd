name: P1 Trivy tool check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-trivy-toolcheck
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == '321Team/infra-cicd' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, p1-cicd, onprem, podman]
    timeout-minutes: 10
    steps:
      - name: Checkout the workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; same reviewed pin as source-validation
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify actual scanner findings and missing-DB error
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/trivy/verify_runner.py
